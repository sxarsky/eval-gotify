# Gotify eval stack — built from source (Dockerfile.eval, copied into the work-tree by
# start-services.sh), SQLite, headless admin user. Host port 8090 -> container 80.
name: eval-gotify
services:
  gotify:
    build:
      context: .
      dockerfile: Dockerfile.eval
    ports:
      - "8090:80"
    environment:
      - GOTIFY_SERVER_PORT=80
      - GOTIFY_DATABASE_DIALECT=sqlite3
      - GOTIFY_DATABASE_CONNECTION=data/gotify.db
      - GOTIFY_DEFAULTUSER_NAME=admin
      - GOTIFY_DEFAULTUSER_PASS=admin
      - GOTIFY_UPLOADEDIMAGESDIR=data/images
    volumes:
      - gotify-data:/app/data
volumes:
  gotify-data:
